name: CI / CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      app_image: ${{ steps.publish.outputs.app_image }}
      extractor_image: ${{ steps.publish.outputs.extractor_image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Workflow and shell validation
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 .github/workflows/ci-cd.yml
          docker run --rm --entrypoint shellcheck -v "$PWD:/repo:ro" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 scripts/deploy.sh
      - name: Deployment script tests
        run: python3 -m unittest discover -s tests -p 'test_deploy.py'
      - name: Build production images
        run: |
          docker build -t kadr-anime:local .
          docker build -t kadr-extractor:local extractor
      - name: Extractor tests
        run: docker run --rm -v "$PWD/extractor/test_service.py:/service/test_service.py:ro" kadr-extractor:local python -m unittest test_service
      - name: Private Docker network smoke test
        run: python3 tests/docker-extractor-check.py
      - name: Publish tested images to GHCR
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          app="$prefix/app:$GITHUB_SHA"
          extractor="$prefix/extractor:$GITHUB_SHA"
          docker tag kadr-anime:local "$app"
          docker tag kadr-extractor:local "$extractor"
          docker push "$app"
          docker push "$extractor"
          # Deployment pins the actual pushed manifests, not mutable tags.
          echo "app_image=$(docker inspect --format '{{index .RepoDigests 0}}' "$app")" >> "$GITHUB_OUTPUT"
          echo "extractor_image=$(docker inspect --format '{{index .RepoDigests 0}}' "$extractor")" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy main
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: production-ssh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Transfer and deploy checked commit
        shell: bash
        env:
          APP_IMAGE: ${{ needs.checks.outputs.app_image }}
          EXTRACTOR_IMAGE: ${{ needs.checks.outputs.extractor_image }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/kadr' }}
          DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT || 'kadr' }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists; skipping this deployment.'
            exit 0
          fi
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( DEPLOY_PORT > 0 && DEPLOY_PORT < 65536 ))
          [[ "$DEPLOY_ROOT" =~ ^/[a-zA-Z0-9_/-]+$ && "$DEPLOY_ROOT" != / && "$DEPLOY_ROOT" != */ ]]
          [[ "$DEPLOY_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          umask 077
          ssh_dir=$(mktemp -d)
          archive=$(mktemp)
          bundle=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"; rm -f "$archive"; rm -rf "$bundle"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh_opts=(-i "$ssh_dir/key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          [[ "$APP_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          [[ "$EXTRACTOR_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          cp compose.production.yaml "$bundle/"
          printf 'APP_IMAGE=%s\nEXTRACTOR_IMAGE=%s\n' "$APP_IMAGE" "$EXTRACTOR_IMAGE" > "$bundle/images.env"
          tar -czf "$archive" -C "$bundle" compose.production.yaml images.env
          checksum=$(sha256sum "$archive" | cut -d ' ' -f 1)
          # shellcheck disable=SC2029 # Client expansion is intentional; every interpolated value is validated above.
          ssh "${ssh_opts[@]}" "$target" "umask 077; mkdir -p '$DEPLOY_ROOT/incoming'; cat > '$DEPLOY_ROOT/incoming/$GITHUB_SHA.tar.gz'" < "$archive"
          # shellcheck disable=SC2029 # Client expansion is intentional; every interpolated value is validated above.
          ssh "${ssh_opts[@]}" "$target" "bash -s -- '$DEPLOY_ROOT' '$GITHUB_SHA' '$checksum' '$DEPLOY_PROJECT'" < scripts/deploy.sh
